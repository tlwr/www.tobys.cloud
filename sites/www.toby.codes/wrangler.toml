name = "www-toby-codes"
main = "src/index.ts"
compatibility_date = "2025-04-02"

[cache]
enabled = true

[exports.default]
type = "worker"

[exports.default.cache]
enabled = false

[exports.Public]
type = "worker"

[exports.Public.cache]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
AUTH_ISSUER = "https://auth.tobys.cloud"

# Binding names stay short for app code.
[[kv_namespaces]]
binding = "POSTS"
id = "eee5ba33649d476ba1ae336acec193ce"

[[kv_namespaces]]
binding = "TAGS"
id = "bfd932a852ab4ed89154b48ff75ba638"

# Custom Domains provision DNS for the hostnames. Zone Routes with /* are
# more specific than page-404's *.toby.codes/* and win for request routing
# (Custom Domains alone lose to a broader zone Route).
[[routes]]
pattern = "www.toby.codes"
custom_domain = true

[[routes]]
pattern = "toby.codes"
custom_domain = true

[[routes]]
pattern = "www.toby.codes/*"
zone_name = "toby.codes"

[[routes]]
pattern = "toby.codes/*"
zone_name = "toby.codes"
