name = "assets-tobys-cloud"
main = "src/index.ts"
compatibility_date = "2025-04-02"

# Exceptions are sent to Discord #alerts through the shared Workers Issues destination.
[observability.issues]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker adds CORS and cache headers. Without this, existing files are
# served by the asset layer and those headers never run.
run_worker_first = true

# Licensed webfonts. Not in git. `node tools/fonts.mjs push` fills the bucket.
[[r2_buckets]]
binding = "FONTS"
bucket_name = "tobys-cloud-fonts"

# Use an explicit zone Route (not only a Custom Domain). page-404 binds
# `*.tobys.cloud/*`; Cloudflare gives Routes precedence over Custom Domains,
# so a Custom Domain alone loses to that wildcard. `assets.tobys.cloud/*` is
# more specific and wins (same pattern as nines/pom Terraform routes).
[[routes]]
pattern = "assets.tobys.cloud/*"
zone_name = "tobys.cloud"
