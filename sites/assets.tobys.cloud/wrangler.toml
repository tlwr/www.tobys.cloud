name = "assets-tobys-cloud"
main = "src/index.ts"
compatibility_date = "2025-04-02"

[assets]
directory = "./public"
binding = "ASSETS"

# Use an explicit zone Route (not only a Custom Domain). page-404 binds
# `*.tobys.cloud/*`; Cloudflare gives Routes precedence over Custom Domains,
# so a Custom Domain alone loses to that wildcard. `assets.tobys.cloud/*` is
# more specific and wins (same pattern as nines/pom Terraform routes).
[[routes]]
pattern = "assets.tobys.cloud/*"
zone_name = "tobys.cloud"
