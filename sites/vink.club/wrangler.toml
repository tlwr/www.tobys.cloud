name = "vink-club"
main = "src/index.ts"
compatibility_date = "2025-04-02"

# Exceptions are sent to Discord #alerts through the shared Workers Issues destination.
[observability.issues]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

# custom_domain creates proxied DNS; zone routes win request routing.
[[routes]]
pattern = "vink.club"
zone_name = "vink.club"
custom_domain = true

[[routes]]
pattern = "www.vink.club"
zone_name = "vink.club"
custom_domain = true

[[routes]]
pattern = "vink.club/*"
zone_name = "vink.club"

[[routes]]
pattern = "www.vink.club/*"
zone_name = "vink.club"
