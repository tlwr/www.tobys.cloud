name = "utilityroom-club"
main = "src/index.tsx"
compatibility_date = "2025-04-02"

[build]
jsx_factory = "h"

[vars]
AUTH_ISSUER = "https://auth.tobys.cloud"

[[kv_namespaces]]
binding = "PROJECTS"
id = "47e06254587f46cfa4904cd122d770b5"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "utilityroom-club-assets"

[[routes]]
pattern = "utilityroom.club"
custom_domain = true
