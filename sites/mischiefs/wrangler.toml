name = "mischiefs"
main = "src/index.ts"
compatibility_date = "2025-04-02"

# Exceptions are sent to Discord #alerts through the shared Workers Issues destination.
[observability.issues]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[[routes]]
pattern = "mischiefs.nl"
custom_domain = true

[[routes]]
pattern = "www.mischiefs.nl"
custom_domain = true
