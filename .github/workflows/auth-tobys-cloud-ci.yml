name: CI for auth.tobys.cloud

on:
  push:
    branches: [main]
    paths:
      - "sites/auth.tobys.cloud/**"
      - "packages/auth-client/**"
      - ".github/workflows/auth-tobys-cloud-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sites/auth.tobys.cloud/**"
      - "packages/auth-client/**"
      - ".github/workflows/auth-tobys-cloud-ci.yml"

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/auth.tobys.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sites/auth.tobys.cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
