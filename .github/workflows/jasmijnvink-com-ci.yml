name: CI for jasmijnvink.com

on:
  push:
    branches: [main]
    paths:
      - 'sites/jasmijnvink.com/**'
      - 'packages/auth-client/**'
  pull_request:
    branches: [main]
    paths:
      - 'sites/jasmijnvink.com/**'
      - 'packages/auth-client/**'

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/jasmijnvink.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sites/jasmijnvink.com/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
