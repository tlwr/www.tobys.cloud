name: CI for www.toby.codes

on:
  push:
    branches: [main]
    paths: ['sites/www.toby.codes/**']
  pull_request:
    branches: [main]
    paths: ['sites/www.toby.codes/**']

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/www.toby.codes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sites/www.toby.codes/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
